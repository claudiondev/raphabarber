name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Os testes usam H2 em memória (src/test/resources/application.properties) - não precisa de um
      # serviço de MySQL no runner.
      - name: Build e testes
        run: ./mvnw -B clean verify
