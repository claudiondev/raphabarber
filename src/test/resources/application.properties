# Configuração usada apenas pelos testes automatizados (unitários não sobem contexto Spring;
# testes de integração usam este perfil). Banco H2 em memória - isolado, rápido, sem depender de MySQL local.

spring.datasource.url=jdbc:h2:mem:raphabarber-test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Segredo só de teste - nunca usar em produção. Precisa ter >= 32 bytes (ver JwtService.validarChave).
api.security.token.secret=segredo-de-teste-apenas-para-a-suite-de-testes-1234567890

app.admin.email=admin.teste@raphabarber.com
app.admin.password=senhaAdminTeste123

cors.allowed-origins=http://localhost:5173
