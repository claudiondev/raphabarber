# Sobe a API + PostgreSQL para desenvolvimento local. Nenhum segredo real aqui - tudo vem do .env
# (copie .env.example para .env e preencha). Ver README.md > "Rodando com Docker".
#
# DB_HOST/DB_PORT/DB_NAME + SPRING_DATASOURCE_USERNAME/PASSWORD (em vez de uma SPRING_DATASOURCE_URL pronta)
# porque é assim que o Render injeta os dados do Postgres gerenciado em produção (ver render.yaml) - o
# Dockerfile monta a URL JDBC a partir dessas variáveis, então local e produção usam o mesmo mecanismo.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:-raphabarber}"
      POSTGRES_USER: "${DB_USERNAME:-raphabarber}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-raphabarber}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-raphabarber} -d ${DB_NAME:-raphabarber}"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-raphabarber}"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME:-raphabarber}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-raphabarber}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      API_SECURITY_TOKEN_SECRET: "${JWT_SECRET:?defina JWT_SECRET no .env (gere com: openssl rand -base64 32)}"
      APP_ADMIN_EMAIL: "${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}"
      APP_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
